name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck, tests, every README number recomputed from the recorded runs, production build
      - run: npm run verify
      # the drop-in guard file is the bundle of its source
      - run: npm run build:guard && git diff --exit-code examples/toolkit-guard/toolkit-guard.mjs
